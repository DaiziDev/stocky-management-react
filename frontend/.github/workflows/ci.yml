name: CI

on:
  push:
    branches: [main, working]
  pull_request:

jobs:
  quality:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (oxlint)
        run: npm run lint

      - name: i18n audit (fr/en parity + key usage)
        run: npm run audit:i18n

      - name: Swagger coverage (every endpoint consumed)
        run: npm run audit:endpoints

      - name: Tests (vitest)
        run: npm test
